[package]
name = "app"
version = "4.5.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# 表单路径「浏览」按钮:系统文件/目录选择对话框(前端经全局对象 __TAURI__.dialog 调用)
tauri-plugin-dialog = "2"
flate2 = "1"
chrono = "0.4"
# Task 3: SSH/SFTP(russh 0.46 起 re-export russh_keys 为 russh::keys)
tokio = { version = "1", features = ["full"] }
russh = "0.46"
russh-sftp = "2"
async-trait = "0.1"
# Task 4: base64 编码(DPAPI 密文存入 JSON 配置用)
base64 = "0.22"
# Task 5: 本地磁盘剩余空间查询(host_check 磁盘信息 / 部署导出前空间检查)
fs4 = "0.12"
# compose 整栈部署:compose YAML 解析
serde_yaml = "0.9"
# Task 6: 部署完成 webhook 通知(阻塞 HTTP 客户端,调用方放 blocking 线程池)
ureq = "2"

# Task 4: Windows DPAPI 密码加密(CurrentUser 作用域),仅 Windows 构建
[target.'cfg(windows)'.dependencies]
windows-dpapi = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

# Task 10: release 轻量化(体积优先)
[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
