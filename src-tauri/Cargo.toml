[package]
name = "app"
version = "5.11.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
log = "0.4"
# 阶段四「桌面体验」:启用 tauri 内置系统托盘(TrayIconBuilder/TrayIconEvent,
# registry tauri-2.11.5 feature 定义 `tray-icon = ["dep:tray-icon"]`)
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
# 表单路径「浏览」按钮:系统文件/目录选择对话框(前端经全局对象 __TAURI__.dialog 调用)
tauri-plugin-dialog = "2"
flate2 = "1"
chrono = "0.4"
# Task 3: SSH/SFTP(russh 0.46 起 re-export russh_keys 为 russh::keys)
tokio = { version = "1", features = ["full"] }
russh = "0.46"
russh-sftp = "2"
async-trait = "0.1"
# Task 4: base64 编码(DPAPI 密文存入 JSON 配置用)
base64 = "0.22"
# 第三批:项目源 compose 变更检测(compose + .env + override 内容哈希)
sha2 = "0.10"
# Task 5: 本地磁盘剩余空间查询(host_check 磁盘信息 / 部署导出前空间检查)
fs4 = "0.12"
# compose 整栈部署:compose YAML 解析
serde_yaml = "0.9"
# Task 6: 部署完成 webhook 通知(阻塞 HTTP 客户端,调用方放 blocking 线程池)
ureq = "2"
# 通知中心:SMTP 邮件发送(rustls 后端,避免引入 openssl 原生依赖)
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "rustls-tls", "builder"] }
# 通知中心:本地系统桌面通知(Rust 侧直接调用,无需前端 IPC)
tauri-plugin-notification = "2"
# 阶段三「连接与数据安全」:配置导出/导入的加密容器
# - argon2:Argon2id 由导出口令派生 AES-256 密钥(password-hash 提供 SaltString 等原语)
argon2 = { version = "0.5", features = ["std", "password-hash"] }
# - aes-gcm:AES-256-GCM 认证加密(口令错误/文件损坏时解密失败,可明确报错)
aes-gcm = "0.10"
# - rand:生成导出容器的随机盐(16B)与 GCM nonce(12B)
rand = "0.8"
# 阶段四「桌面体验」:检查更新(请求 GitHub releases/latest)。
# - default-features = false:不引入 native-tls,统一走 rustls(ring provider,
#   Windows 免 openssl/cmake 原生依赖);json = 响应解析,socks = socks5 代理
#   (Proxy::all 支持 http/https/socks4/socks5/socks5h,见 reqwest 0.12 proxy.rs)
# - 用 0.12 而非依赖树里的 0.13(仅 tauri 未启用的 normal feature 的可选依赖,
#   实际不编译):0.13 已移除 rustls-tls feature 名,且 0.12 feature 名与需求一致
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }

# Task 4: Windows DPAPI 密码加密(CurrentUser 作用域),仅 Windows 构建
[target.'cfg(windows)'.dependencies]
windows-dpapi = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

# Task 10: release 轻量化(体积优先)
[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
