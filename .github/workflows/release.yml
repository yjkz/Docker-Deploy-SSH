# 发版流水线:push tag v* 触发。build 出 NSIS 安装包,release job 挂到 GitHub Release。
# 版本防呆在 build job 挡住:tag 与 tauri.conf.json 不一致直接失败,不会走到发版。
name: Release

on:
  push:
    tags: ["v*"]

# 发版不取消:同一 tag 重推时等旧跑结束,避免半成品 Release
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# 创建 Release 与上传产物需要 contents: write
permissions:
  contents: write

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      # fetch-depth: 0 拉全量历史与 tags,保证两 job 数据视图一致
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 防忘 bump:tag 版本(剥 v)必须与 src-tauri/tauri.conf.json 的 version 一致
      - name: Verify version matches tauri.conf.json
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag_version="${REF_NAME#v}"
          conf_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "tag 版本        : $tag_version"
          echo "tauri.conf.json : $conf_version"
          if [ "$tag_version" != "$conf_version" ]; then
            echo "::error::tag 版本与 tauri.conf.json 不一致，请先 bump"
            exit 1
          fi
        shell: bash

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci
        shell: bash

      # bundle.targets 只有 nsis,产物在 src-tauri/target/release/bundle/nsis/*.exe
      - name: Build Tauri app
        run: npm run tauri build
        shell: bash

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: nsis-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 拉全量历史与 tags,读 tag 附注需要完整数据
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 取更新说明:优先经 GitHub API 读附注对象(与 actions/checkout 对 tag 对象的
      # 处理方式无关,真机实测 checkout 后本地 git 侧 objecttype 判别不可靠)。
      # API 对象类型为 "tag" → 取 .message;否则(轻量标签)body 置空,交给
      # generate_release_notes 兜底。API 失败不阻断发版(回退空 body)。
      - name: Extract tag annotation into release body
        env:
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$REF_NAME" ]; then
            echo "::error::未能取得 tag 名（REF_NAME 为空）"
            exit 1
          fi
          body_file="release_body.md"
          : > "$body_file"
          obj_type=$(gh api "repos/$REPO/git/refs/tags/$REF_NAME" --jq '.object.type' 2>/dev/null || echo "")
          if [ "$obj_type" = "tag" ]; then
            tag_sha=$(gh api "repos/$REPO/git/refs/tags/$REF_NAME" --jq '.object.sha')
            gh api "repos/$REPO/git/tags/$tag_sha" --jq '.message' > "$body_file"
            echo "已取得附注（$(wc -c < "$body_file") 字节）"
          else
            echo "轻量标签或 API 不可达（obj_type=$obj_type）：body 置空，将仅使用自动生成的 release notes"
          fi
          echo "---- release body（空即无附注）----"
          cat "$body_file"
          echo "----------------------------------"
        shell: bash

      - name: Download NSIS installer artifact
        uses: actions/download-artifact@v4
        with:
          name: nsis-installer
          path: dist

      # body_path + generate_release_notes 组合:附注说明在前,自动生成的 Full Changelog 追加在后;
      # body 为空(轻量标签)时只剩自动生成 notes。官方 README:
      # "If body is specified, the body will be pre-pended to the automatically generated notes."
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release_body.md
          files: dist/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
